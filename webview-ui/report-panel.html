<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        style-src ${webview.cspSource} 'unsafe-inline'; 
        script-src 'nonce-${nonce}';
        font-src ${webview.cspSource};
        img-src ${webview.cspSource} https:;
        connect-src ${webview.cspSource};
    ">
    <link rel="stylesheet" type="text/css" href="${cssUri}">
    <title>Error Context Report</title>
</head>

<body>
    <div class="toolbar">
        <div class="summary-stats">
            <span id="stat-errors" class="stat-chip stat-error" style="display:none;">0 Errors</span>
            <span id="stat-warnings" class="stat-chip stat-warning" style="display:none;">0 Warnings</span>
            <span id="stat-groups" class="stat-chip stat-total">0 Groups</span>
        </div>
        <div class="actions">
            <div class="search-box">
                <input type="text" id="filter-input" placeholder="Search file, message, rule...">
            </div>
            <button id="copy-markdown-button" class="btn">Copy Report (MD)</button>
            <button id="expand-all-button" class="btn btn-secondary">Expand All</button>
            <button id="collapse-all-button" class="btn btn-secondary">Collapse All</button>
        </div>
    </div>

    <div id="report-container">
        <p class="placeholder">Scanning diagnostics or awaiting report data...</p>
    </div>

    <script nonce="${nonce}" src="${scriptUri}"></script>
</body>

</html>
